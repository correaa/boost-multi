image: debian:stable

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task
  CMAKE_GENERATOR: "Unix Makefiles"

g++:
  stage: build
  interruptible: false
  script:
    - apt-get -qq update
    - apt-get -qq install --no-install-recommends -y --quiet g++ ninja-build make cmake libboost-dev libboost-serialization-dev
    - cmake . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DCMAKE_CXX_FLAGS="-D_GLIBCXX_ASSERTIONS -D_GLIBCXX_DEBUG=1 -ftrivial-auto-var-init=zero -fPIE  -pie  -Wl,-z,relro,-z,now -fstack-protector-strong -fstack-clash-protection"
    - cmake --build build
    - ctest --test-dir build --parallel 2 --output-on-failure

g++-latest release:
  stage: build
  interruptible: false
  image: debian:latest
  script:
    - apt-get -qq update
    - apt-get -qq install --no-install-recommends -y --quiet g++ ninja-build make cmake libboost-dev libboost-serialization-dev
    - cmake . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DCMAKE_CXX_FLAGS="-D_GLIBCXX_ASSERTIONS -D_GLIBCXX_DEBUG=1 -ftrivial-auto-var-init=zero -fPIE  -pie  -Wl,-z,relro,-z,now -fstack-protector-strong -fstack-clash-protection"
    - cmake --build build
    - ctest --test-dir build --parallel 2 --output-on-failure
  needs: ["g++"]

clang++:  # debian-stable -> clang 19.1.7 as of June 2026
  stage: build
  interruptible: false
  script:
    - apt-get -qq update
    - apt-get -qq install --no-install-recommends -y --quiet clang ninja-build make cmake libboost-dev libboost-serialization-dev
        # pkg-config libboost-serialization-dev libblas-dev liblapack-dev libfftw3-dev
    - CXX=clang++ cmake . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DCMAKE_CXX_FLAGS="-D_GLIBCXX_ASSERTIONS -D_GLIBCXX_DEBUG=1"
    - cmake --build build
    - ctest --test-dir build --parallel 2 --output-on-failure

clang++-latest libc++ format:  # debian-latest -> 19.1.7 as of June 2026
  stage: build
  image: debian:latest
  interruptible: true
  script:
    - apt-get -qq update
    - apt-get -qq install --no-install-recommends -y --quiet ca-certificates git clang clang-format ninja-build cmake make libboost-serialization-dev libblas-dev libc++-dev libc++abi-dev libfftw3-dev liblapack-dev pkg-config tar wget
    - CXX=clang++ cmake . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DCMAKE_CXX_FLAGS="-stdlib=libc++ -DBOOST_NO_CXX98_FUNCTION_BASE -D_LIBCPP_ENABLE_CXX17_REMOVED_AUTO_PTR -D_LIBCPP_HARDENING_MODE=_LIBCPP_HARDENING_MODE_DEBUG"
    - cmake --build build || cmake --build . --parallel 1 --verbose
    - ctest --test-dir build --parallel 2 --output-on-failure
    - clang-format --version
    - clang-format --dry-run -Werror test/*.cpp include/**/*.hpp || echo "errors in formatting"
  needs: ["clang++"]

visual-studio-windows:
  stage: build
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
  allow_failure: true  # runner not always available
  variables:
    # BOOST_INCLUDEDIR: ${CI_PROJECT_DIR}/vcpkg/installed/x64-windows/include
    # BOOST_LIBRARYDIR: ${CI_PROJECT_DIR}/vcpkg/installed/x64-windows/lib
    VCPKG_ROOT: ${CI_PROJECT_DIR}/vcpkg
    CMAKE_GENERATOR: ""
  cache:
    key: vcpkg-windows
    paths:
      - vcpkg/
  before_script: []  # override global before_script (bash commands don't work on Windows runner)
  script:
    # vvv saas-windows-medium-amd64 runner comes with all this
    # - choco --version
    # - choco install poshgit -y
    # - choco install visualstudio2019community -y --params "'--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended'"
    # - git clone --depth=1 https://github.com/microsoft/vcpkg.git
    - if (!(Test-Path vcpkg)) { git clone --depth=1 https://github.com/microsoft/vcpkg.git }
    - .\vcpkg\bootstrap-vcpkg.bat
    - .\vcpkg\vcpkg install boost-core  # boost-multi-array boost-timer pkgconf
    - mkdir build
    - $env:Path += ";${CI_PROJECT_DIR}/vcpkg/installed/x64-windows/bin"
    - cmake --version
    - cmake -S . -B build -DCMAKE_CXX_FLAGS="/MP" -DCMAKE_CXX_STANDARD=23 -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
    - cmake --build build --config Release --parallel 2 --verbose
    - ctest --test-dir build --output-on-failure -C Release
  tags:
    - saas-windows-medium-amd64
  needs: ["clang++", "g++"]
  timeout: 30 minutes
